name: Docker Build & Push

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        
      - name: Login DocekrHub
        uses: docker/login-action@v3
        with:
          username: {{ vars.DOCKERHUB_USER }}
          password: {{ secrets.DOCKERHUB_PASS }}
